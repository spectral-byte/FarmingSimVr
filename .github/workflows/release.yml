name: Release

# Pushing a version tag (v1.2.0, or v1.2.0-pre.1 for a pre-release) builds and tests exactly as CI does
# and then creates a DRAFT GitHub release holding the zip bundle, the Setup exe and the symbols zip.
# The workflow never publishes: read the draft, write the notes and publish it by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Fails before anything is built when the tag and the Companion Mod's version disagree.
  check-tag:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      mod_version: ${{ steps.tag.outputs.mod_version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the tag against the Companion Mod's version
        id: tag
        shell: pwsh
        run: scripts/check_release_tag.ps1 -Tag $env:GITHUB_REF_NAME

  # The same steps CI runs on every change (configure, build, both test runs, package, Installer test).
  build-and-test:
    needs: check-tag
    uses: ./.github/workflows/build-and-test.yml

  release:
    needs: [check-tag, build-and-test]
    runs-on: windows-latest
    timeout-minutes: 10
    # The only write access to the repository in any workflow.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.check-tag.outputs.version }}
      MOD_VERSION: ${{ needs.check-tag.outputs.mod_version }}
      PRERELEASE: ${{ needs.check-tag.outputs.prerelease }}
    steps:
      - name: Download the built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: built
          merge-multiple: true

      # Packaging names the assets after the Companion Mod's four-part version (FS25_VR_v1.2.0.0.zip);
      # releases drop its last .0 (FS25_VR_v1.2.0.zip), which is what the tag names.
      - name: Name the assets for the release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path assets | Out-Null
          foreach ($suffix in '.zip', '_Setup.exe', '_Symbols.zip') {
            $built = "built/FS25_VR_v$($env:MOD_VERSION)$suffix"
            if (-not (Test-Path $built)) { throw "$built was not built." }
            Copy-Item $built "assets/FS25_VR_v$($env:VERSION)$suffix"
          }
          Get-ChildItem assets | Format-Table Name, Length

      - name: Create the draft release
        shell: pwsh
        run: |
          $arguments = @('release', 'create', $env:TAG, '--repo', $env:GITHUB_REPOSITORY,
            '--draft', '--verify-tag', '--title', $env:TAG, '--notes', '')
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          $arguments += (Get-ChildItem assets | ForEach-Object { $_.FullName })
          gh @arguments
          if ($LASTEXITCODE) { throw "gh release create failed ($LASTEXITCODE)" }
