name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR pushes are cancelled; every push to main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The steps live in build-and-test.yml, shared with the release workflow so the two cannot drift apart.
jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml
